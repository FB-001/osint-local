[project]
name = "perspicio"
version = "0.1.0"
description = "Ferramenta local, modular e explicável para apoio à coleta e análise de informações"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "typer>=0.27.1",
]

[project.scripts]
perspicio = "perspicio:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
